<!doctype html>
<html><head><meta charset="utf-8"><title>How Aqua Code works</title>
<style>
:root{--tx:#f2f3f5;--mut:#9ea3ad;--dim:#6b7078;--silver:#e8eaee;--teal:#8fb8b2;--violet:#a79fc2;--green:#6ee7a8;--red:#ff6b6b;--amber:#ffb454}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#07080a;color:var(--tx);font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#bg,#scenes{position:absolute;inset:0}
.blob{position:absolute;border-radius:50%;opacity:.55;will-change:transform}
.scene{position:absolute;inset:0;opacity:0;transform-origin:50% 50%;visibility:hidden}
.abs{position:absolute}
.g{position:absolute;background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.025));border:1.5px solid rgba(255,255,255,.15);border-radius:38px;
  box-shadow:inset 2px 2px 0 rgba(255,255,255,.34),inset -1px -1px 0 rgba(255,255,255,.08),inset 0 0 40px rgba(255,255,255,.03),0 44px 100px -24px rgba(0,0,0,.75);
  backdrop-filter:blur(28px) saturate(170%)}
.g::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(500px circle at 15% -5%,rgba(255,255,255,.22),transparent 60%)}
.ic{display:inline-flex;align-items:center;justify-content:center}.ic svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.h1{position:absolute;font-weight:700;letter-spacing:-2px;line-height:1.02;font-size:104px;white-space:nowrap}
.h1 em{font-style:normal;background:linear-gradient(120deg,#fff,#aeb4be);-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:12px;padding:8px 22px;border-radius:999px;font-weight:650;font-size:28px;border:2px solid currentColor;background:rgba(255,255,255,.06)}
.chip i{width:14px;height:14px;border-radius:50%;background:currentColor;box-shadow:0 0 16px currentColor}
.mono{font-family:Consolas,"Cascadia Mono",monospace}
.pill{display:inline-flex;align-items:center;gap:14px;padding:14px 28px;border-radius:999px;font-size:32px;font-weight:600;background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1.5px solid rgba(255,255,255,.17);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.35),0 18px 40px -12px rgba(0,0,0,.6)}
.dot{width:16px;height:16px;border-radius:50%;background:var(--green);box-shadow:0 0 18px var(--green);flex:none}
.lbl{font-size:23px;letter-spacing:3px;color:var(--dim);font-weight:600}
.row{display:flex;align-items:center;gap:18px}
.bar{position:relative;height:16px;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}.bar>i{display:block;height:100%;border-radius:inherit}
#nav{position:absolute;left:0;right:0;top:30px;display:flex;justify-content:center;gap:10px;opacity:0}
.nv{display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;font-size:21px;font-weight:600;color:#7c818b;border:1.5px solid transparent;white-space:nowrap}
.nv b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:rgba(255,255,255,.08)}
.nv.on{color:#fff;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);box-shadow:0 0 30px rgba(255,255,255,.12)}
.nv.on b{background:#fff;color:#111}
.nv.past{color:#a9aeb7}
#cap{position:absolute;left:0;right:0;bottom:50px;display:flex;justify-content:center;pointer-events:none}
.capl{position:absolute;bottom:0;max-width:1640px;text-align:center;font-size:40px;line-height:1.3;font-weight:600;letter-spacing:-.2px;padding:16px 38px;border-radius:30px;background:rgba(6,7,9,.6);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);opacity:0}
.capl span{opacity:.42}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 50%,transparent 55%,rgba(0,0,0,.55))}
.ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.5)}
</style></head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="scenes"></div>
  <div id="nav"></div>
  <div id="cap"></div>
  <div id="vig"></div>
</div>
<script>
/* ======================= tiny deterministic timeline engine (every frame is a pure function of time) ======================= */
const $=(s,r=document)=>r.querySelector(s);
function mk(tag,cls,html,parent){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(parent)parent.appendChild(e);return e}
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const E={out:t=>1-Math.pow(1-t,3),inout:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,lin:t=>t,spring:t=>t>=1?1:1-Math.exp(-6.5*t)*Math.cos(11*t),quint:t=>1-Math.pow(1-t,5)};
const P=(t,a,d,ease=E.out)=>ease(clamp((t-a)/d));
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function put(el,o){el.style.opacity=o.o===undefined?1:o.o;el.style.transform=`translate(${(o.x||0).toFixed(2)}px,${(o.y||0).toFixed(2)}px) scale(${o.sx===undefined?(o.s===undefined?1:o.s):o.sx},${o.sy===undefined?(o.s===undefined?1:o.s):o.sy}) rotate(${o.r||0}deg)`;if(o.b!==undefined)el.style.filter=o.b>.05?`blur(${o.b.toFixed(1)}px)`:'none'}
function appear(el,t,a,d=.6,opt={}){const y=opt.y===undefined?34:opt.y,s0=opt.s===undefined?.93:opt.s,x=opt.x||0,p=P(t,a,d,opt.ease||E.out);put(el,{o:clamp(p*1.6),x:(1-p)*x,y:(1-p)*y,s:s0+(1-s0)*p,b:(1-p)*(opt.blur===undefined?7:opt.blur)});return p}
const SVG={
check:'<svg viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>',
file:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>',
term:'<svg viewBox="0 0 24 24"><path d="m4 17 6-6-6-6M12 19h8"/></svg>',
edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z"/></svg>',
bolt:'<svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8Z"/></svg>',
arrow:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
folder:'<svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>',
lock:'<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
eye:'<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>',
search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
layers:'<svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>',
shield:'<svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2.2 2.2L15.5 10"/></svg>',
key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9-9M16 7l3 3M14 9l2 2"/></svg>',
cube:'<svg viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg>',
refresh:'<svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 4v4h4M4 13a8 8 0 0 0 14.9 3M20 20v-4h-4"/></svg>'};
const ic=(n,size)=>`<span class="ic" style="font-size:${size||40}px">${SVG[n]}</span>`;

let T=null,SC=[],WIN=[],NAVEL=[];
const EV=k=>T.ev.p[String(k)];
function newScene(){return mk('div','scene','',$('#scenes'))}
function card(R,x,y,w,h,html,css){const c=mk('div','g',html||'',R);c.style.cssText+=`left:${x}px;top:${y}px;width:${w}px;height:${h}px;${css||''}`;return c}
function head(R,html){const h=mk('div','h1',html,R);h.style.cssText+='left:140px;top:104px;font-size:66px';return h}
const pulse=(t,a,d)=>Math.sin(Math.PI*clamp((t-a)/d));

/* ======================= backdrop ======================= */
const BL=[['#8a8f99',900,-200,-260,.0],['#4b5563',820,1200,160,1.7],['#a0a4ad',760,500,720,3.1],['#374151',620,1500,640,4.4]];
const blobs=BL.map(b=>{const e=mk('div','blob','',$('#bg'));e.style.cssText+=`width:${b[1]}px;height:${b[1]}px;background:radial-gradient(circle,${b[0]},transparent 68%)`;return e});
const gridEl=mk('div','',null,$('#bg'));gridEl.style.cssText='position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:72px 72px;-webkit-mask-image:radial-gradient(75% 75% at 50% 50%,#000,transparent)';
function updBg(t){blobs.forEach((e,i)=>{const b=BL[i];e.style.transform=`translate(${b[2]+Math.sin(t*.22+b[4])*130}px,${b[3]+Math.cos(t*.17+b[4])*90}px)`});gridEl.style.backgroundPosition=`${(t*9)%72}px ${(t*6)%72}px`}

/* ======================= scene 0: title ======================= */
function scene0(){
  const R=newScene(),ev=T.ev.intro;
  const rings=[0,1,2,3].map(()=>mk('div','ring','',R));
  const logo=mk('img','abs','',R);logo.src='logo.png';logo.style.cssText+='left:810px;top:230px;width:300px;height:300px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))';
  const h=mk('div','h1','Aqua <em>Code</em>',R);h.style.cssText+='left:0;right:0;top:560px;text-align:center;font-size:150px;letter-spacing:-5px';
  const sub=mk('div','abs','HOW IT WORKS',R);sub.style.cssText+='left:0;right:0;top:742px;text-align:center;font-size:38px;letter-spacing:14px;color:var(--mut);font-weight:600';
  const sub2=mk('div','abs','From a messy request to a finished project',R);sub2.style.cssText+='left:0;right:0;top:806px;text-align:center;font-size:34px;color:var(--dim)';
  return{el:R,upd(t){
    rings.forEach((r,i)=>{const p=((t*.42+i/4)%1),rad=160+p*820;r.style.cssText=`left:${960-rad}px;top:${380-rad}px;width:${rad*2}px;height:${rad*2}px;opacity:${(1-p)*.22*P(t,ev.drop[0],.5)}`});
    const lp=P(t,ev.drop[0]-.2,1.0,E.spring);put(logo,{o:clamp(lp*2),y:(1-lp)*-160,s:.6+.4*lp,b:(1-clamp(lp*1.5))*10});
    appear(h,t,ev.text,.9,{y:40});appear(sub,t,ev.text+.5,.8,{y:20});appear(sub2,t,ev.text+1.0,.8,{y:20})}}}

/* ======================= scene 1: understand first ======================= */
function scene1(){
  const R=newScene(),e=EV(1),msg='mak me a slime shdaer gmae, relly realistc, i can sqeeze it';
  const hd=head(R,'Understand <em>first</em>');
  const you=card(R,140,230,720,430,`<div class="lbl">YOU TYPE</div><div id="ty" class="mono" style="margin-top:28px;font-size:38px;line-height:1.5"></div>`,'padding:40px 46px');
  const ty=$('#ty',you);
  const mid=mk('div','abs',`<div style="width:130px;height:130px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.04));border:2px solid rgba(255,255,255,.35)">${ic('bolt',62)}</div><div style="margin-top:18px;font-size:24px;color:var(--mut);text-align:center;line-height:1.3">strongest<br>model</div>`,R);mid.style.cssText+='left:885px;top:340px;width:130px';
  const a1=mk('div','abs',ic('arrow',44),R),a2=mk('div','abs',ic('arrow',44),R);a1.style.cssText+='left:826px;top:386px;color:#9ea3ad';a2.style.cssText+='left:1022px;top:386px;color:#9ea3ad';
  const brief=card(R,1060,230,720,430,`<div class="lbl">CLEAR BRIEF</div><div id="bl" style="margin-top:26px;display:flex;flex-direction:column;gap:22px"></div>`,'padding:40px 46px');
  const items=['Goal: a small WebGL shader game','Look: translucent, realistic jelly slime','Play: squish and poke it with the mouse','Output: one index.html, works offline'].map(s=>mk('div','row',`<span style="color:#6ee7a8">${ic('check',40)}</span><span style="font-size:34px;line-height:1.25">${s}</span>`,$('#bl',brief)));
  const tag=mk('div','pill abs',`${ic('eye',34)} No guessing`,R);tag.style.cssText+='left:140px;top:700px;font-size:30px';
  return{el:R,upd(t){
    appear(hd,t,e[0]-.8,.7,{y:30});appear(you,t,e[0],.8,{y:60,ease:E.spring});
    const k=Math.floor(P(t,e[1],e[2]-e[1],E.lin)*msg.length),caret=(t>e[1]&&t<e[3]+.6&&Math.floor(t*3)%2===0)?'<span style="display:inline-block;width:4px;height:40px;background:#fff;margin-left:4px;vertical-align:-6px"></span>':'';ty.innerHTML=esc(msg.slice(0,k))+caret;
    const m=appear(mid,t,e[2]-.2,.6,{y:20,s:.8,ease:E.spring});mid.firstChild.style.boxShadow=`0 0 ${70*pulse(t,e[3],1.2)}px rgba(255,255,255,${.5*pulse(t,e[3],1.2)})`;
    appear(a1,t,e[3]-.2,.5,{x:-20,y:0,s:1});appear(a2,t,e[3]+.3,.5,{x:-20,y:0,s:1});
    appear(brief,t,e[4],.8,{y:60,ease:E.spring});items.forEach((it,i)=>appear(it,t,e[5+i],.5,{y:14,x:-24,s:1}));appear(tag,t,e[8]+.4,.6,{y:20,s:.9,ease:E.spring})}}}

/* ======================= scene 2: cheapest model first ======================= */
function scene2(){
  const R=newScene(),e=EV(2);
  const hd=head(R,'Cheapest model <em>first</em>');
  const defs=[['Lite','Cheap and fast','#8fb8b2',140],['Standard','Balanced','#a79fc2',700],['Pro','Strongest','#e8eaee',1260]];
  const cs=defs.map(d=>{const c=card(R,d[3],230,520,300,`<div class="chip" style="color:${d[2]}"><i></i>${d[0]}</div><div style="margin-top:28px;font-size:40px;font-weight:700">${d[1]}</div><div class="bar" style="margin-top:30px"><i style="width:100%;background:${d[2]};opacity:.5"></i></div><div class="st" style="margin-top:22px;font-size:28px;color:var(--mut)">ready</div>`,'padding:40px');return c});
  const sts=cs.map(c=>$('.st',c));
  const la=mk('div','pill abs',`${ic('arrow',32)} Everyday request starts here`,R);la.style.cssText+='left:140px;top:570px;font-size:28px';
  const lb=mk('div','pill abs',`${ic('bolt',32)} Shader, 3D, game: starts here`,R);lb.style.cssText+='left:700px;top:570px;font-size:28px';
  const pk=mk('div','chip',`${ic('refresh',28)} full conversation`,R);pk.style.cssText+='position:absolute;left:0;top:0;font-size:26px;color:#fff;background:rgba(20,22,26,.8)';
  const sv=mk('div','pill abs',`${ic('check',32)} You only use the strong model when it is needed`,R);sv.style.cssText+='left:140px;top:726px;font-size:30px;color:#6ee7a8';
  return{el:R,upd(t){
    appear(hd,t,e[0]-.8,.7,{y:30});cs.forEach((c,i)=>appear(c,t,e[0]+.14*i,.7,{y:60,ease:E.spring}));
    appear(la,t,e[1],.6,{y:20,s:.9,ease:E.spring});appear(lb,t,e[2],.6,{y:20,s:.9,ease:E.spring});
    const f=P(t,e[3],.5,E.out);cs[0].style.borderColor=`rgba(255,107,107,${.7*f})`;cs[0].style.boxShadow=`inset 2px 2px 0 rgba(255,255,255,.34),0 0 ${60*f}px rgba(255,107,107,${.35*f}),0 44px 100px -24px rgba(0,0,0,.75)`;sts[0].textContent=f>.4?'stuck: failed twice':'ready';sts[0].style.color=f>.4?'#ff8f8f':'';
    const mv=P(t,e[4],.9,E.inout);const px=400+(960-400)*mv,py=650-50*Math.sin(Math.PI*mv);put(pk,{x:px,y:py,o:clamp((t-e[4]+.1)*6)*(1-P(t,e[5]+.6,.5)),s:1});
    const g=P(t,e[5],.6,E.spring);cs[1].style.borderColor=`rgba(110,231,168,${.65*g})`;cs[1].style.boxShadow=`inset 2px 2px 0 rgba(255,255,255,.34),0 0 ${80*g}px rgba(110,231,168,${.4*g}),0 44px 100px -24px rgba(0,0,0,.75)`;sts[1].textContent=g>.4?'takes over with the full conversation':'ready';sts[1].style.color=g>.4?'#6ee7a8':'';
    appear(sv,t,e[5]+.5,.7,{y:20,s:.92,ease:E.spring})}}}

/* ======================= scene 3: the agent loop ======================= */
function scene3(){
  const R=newScene(),e=EV(3);
  const hd=head(R,'The agent <em>loop</em>');
  const cx=600,cy=480,r=215;
  const svg=mk('div','abs',`<svg width="700" height="620" viewBox="-350 -310 700 620" style="overflow:visible"><circle r="${r}" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="3" stroke-dasharray="4 14"/></svg>`,R);svg.style.cssText+=`left:${cx-350}px;top:${cy-310}px`;
  const nodes=[['Think','bolt',-90],['Act','edit',0],['Read result','eye',90],['Check','check',180]].map(n=>{const a=n[2]*Math.PI/180;const el=mk('div','pill abs',`${ic(n[1],34)}${n[0]}`,R);el.style.cssText+=`left:0;top:0;font-size:30px;padding:14px 26px`;el._p=[cx+Math.cos(a)*r,cy+Math.sin(a)*r];return el});
  const orb=mk('div','abs','',R);orb.style.cssText+='left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;box-shadow:0 0 40px 10px rgba(255,255,255,.55)';
  const trail=[1,2,3,4,5].map(i=>{const d=mk('div','abs','',R);d.style.cssText+=`left:0;top:0;width:${28-i*4}px;height:${28-i*4}px;margin:${-(28-i*4)/2}px 0 0 ${-(28-i*4)/2}px;border-radius:50%;background:#fff;opacity:${.5-i*.08}`;return d});
  const tools=[['file','read_file'],['edit','write_file'],['edit','edit_file'],['term','run_command'],['search','search_code'],['eye','look_page']].map((d,i)=>{const p=mk('div','pill abs',`<span style="color:#9ea3ad">${ic(d[0],34)}</span><span class="mono" style="font-size:30px">${d[1]}</span>`,R);p.style.cssText+=`left:1180px;top:${210+i*92}px;width:580px;font-size:30px`;return p});
  const w=3.0; // rad per second
  return{el:R,upd(t){
    appear(hd,t,e[0]-.8,.7,{y:30});appear(svg,t,e[0],.8,{y:0,s:.9});
    nodes.forEach((n,i)=>{appear(n,t,e[0]+.1*i,.6,{y:0,s:.85,ease:E.spring});n.style.left=(n._p[0]-n.offsetWidth/2)+'px';n.style.top=(n._p[1]-n.offsetHeight/2)+'px'});
    const on=clamp((t-e[0]-.4)*3),ang=-Math.PI/2+(t-e[0])*w;
    put(orb,{x:cx+Math.cos(ang)*r,y:cy+Math.sin(ang)*r,o:on});trail.forEach((d,i)=>{const a=ang-(i+1)*.13;put(d,{x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r,o:on*(.5-(i+1)*.08)})});
    let cur=-1;tools.forEach((p,i)=>{const ap=appear(p,t,e[1+i],.5,{x:50,y:0,s:.95});if(t>e[1+i])cur=i});
    const last=e[6]+.6;const idx=t>last?Math.floor((t-last)/.55)%6:cur;tools.forEach((p,i)=>{const hot=(i===idx)&&t>e[1];p.style.borderColor=hot?'rgba(255,255,255,.7)':'rgba(255,255,255,.17)';p.style.background=hot?'linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.08))':''})}}}

/* ======================= scene 4: tested recipes ======================= */
function scene4(){
  const R=newScene(),e=EV(4);

    cs.forEach((c,i)=>{const mine=i===0;if(mine){c.style.borderColor=`rgba(110,231,168,${.65*sel})`;c.style.boxShadow=`inset 2px 2px 0 rgba(255,255,255,.34),0 0 ${70*sel}px rgba(110,231,168,${.35*sel}),0 44px 100px -24px rgba(0,0,0,.75)`;sts[i].textContent=sel>.4?'The agent works here':'';sts[i].style.color='#6ee7a8'}else{c.style.opacity=c.style.opacity*(1-.5*sel);lks[i].style.opacity=sel;sts[i].textContent=sel>.4?'invisible to the agent':'';sts[i].style.color='#ffb454'}});
    appear(pr,t,e[6],.7,{y:40,ease:E.spring})}}}

/* ======================= scene 10: you stay in control ======================= */
function scene10(){
  const R=newScene(),e=EV(10);
  const hd=head(R,'You stay <em>in control</em>');
  const ap=card(R,140,220,880,500,`<div class="row" style="font-size:38px;font-weight:700"><span style="color:#ffb454">${ic('shield',54)}</span><span class="at">Approval needed: run a command</span></div><div class="mono" style="margin-top:30px;padding:26px 30px;border-radius:20px;background:rgba(0,0,0,.4);font-size:34px">PS&gt; python test.py</div><div class="res" style="margin-top:28px;font-size:34px;color:#6ee7a8;opacity:0;display:flex;align-items:center;gap:14px">${ic('check',44)}Allowed. Tests passed.</div><div class="bt" style="position:absolute;left:44px;bottom:44px;display:flex;gap:22px"><span class="al" style="width:260px;height:88px;border-radius:999px;background:linear-gradient(160deg,#f4f5f7,#cfd3da 60%,#8d929c);color:#14161a;display:flex;align-items:center;justify-content:center;gap:12px;font-size:36px;font-weight:700">${ic('check',38)}Allow</span><span style="width:240px;height:88px;border-radius:999px;border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;gap:12px;font-size:36px;font-weight:600">${ic('x',38)}Deny</span></div>`,'padding:44px;border-color:rgba(255,180,84,.5)');
  const al=$('.al',ap),bt=$('.bt',ap),res=$('.res',ap),at=$('.at',ap);
  const cd=[['key','Your keys never leave your PC','#8fb8b2'],['shield','Dangerous commands are blocked','#ff8f8f'],['folder','Works only in the project folder','#6ee7a8']].map((d,i)=>{const c=card(R,1080,220+i*180,700,150,`<div class="row" style="height:100%"><span style="color:${d[2]}">${ic(d[0],58)}</span><span style="font-size:34px;font-weight:650;line-height:1.2">${d[1]}</span></div>`,'padding:0 40px;border-radius:32px');return c});
  return{el:R,upd(t){
    appear(hd,t,e[0]-.8,.7,{y:30});appear(ap,t,e[0],.8,{y:60,ease:E.spring});
    al.style.transform=`scale(${1-.08*pulse(t,e[1]-.1,.3)})`;const ok=t>e[1];bt.style.opacity=ok?Math.max(0,1-(t-e[1])*3):1;res.style.opacity=P(t,e[2],.4);at.textContent=ok?'Approved':'Approval needed: run a command';ap.style.borderColor=ok?'rgba(110,231,168,.5)':'rgba(255,180,84,.5)';
    cd.forEach((c,i)=>appear(c,t,e[3+i],.7,{y:40,ease:E.spring}))}}}

/* ======================= scene 11: outro ======================= */
function scene11(){
  const R=newScene(),ev=T.ev.out;
  const rings=[0,1,2,3].map(()=>mk('div','ring','',R));
  const logo=mk('img','abs','',R);logo.src='logo.png';logo.style.cssText+='left:830px;top:250px;width:260px;height:260px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))';
  const h=mk('div','h1','Free. Local. <em>Yours.</em>',R);h.style.cssText+='left:0;right:0;top:540px;text-align:center;font-size:130px;letter-spacing:-4px';
  const sub=mk('div','abs','AQUA CODE   |   MADE BY SAAD',R);sub.style.cssText+='left:0;right:0;top:712px;text-align:center;font-size:36px;letter-spacing:10px;color:var(--mut);font-weight:600';
  return{el:R,upd(t){
    rings.forEach((r,i)=>{const p=((t*.4+i/4)%1),rad=150+p*800;r.style.cssText=`left:${960-rad}px;top:${380-rad}px;width:${rad*2}px;height:${rad*2}px;opacity:${(1-p)*.2*P(t,ev.drop[0],.5)}`});
    const lp=P(t,ev.drop[0],1.0,E.spring);put(logo,{o:clamp(lp*2),y:(1-lp)*-140,s:.6+.4*lp,b:(1-clamp(lp*1.5))*10});appear(h,t,ev.text,.9,{y:40});appear(sub,t,ev.text+.5,.8,{y:20})}}}

/* ======================= captions + progress navigation ======================= */
const CAPS=[];
function buildCaps(){
  T.lines.forEach((ln,i)=>{const c=mk('div','capl','',$('#cap'));c.innerHTML=ln.words.map(w=>`<span>${esc(w.w)}</span>`).join(' ');CAPS.push({el:c,spans:[...c.children],ln})})
}
function capUpd(t){CAPS.forEach(c=>{const a=c.ln.s-.15,b=c.ln.e+.35;const vis=t>=a&&t<=b;c.el.style.display=vis?'block':'none';if(!vis)return;
  c.el.style.opacity=P(t,a,.25,E.out)*(1-P(t,b-.3,.3,E.lin));c.el.style.transform=`translateY(${(1-P(t,a,.35))*16}px)`;
  c.ln.words.forEach((w,k)=>{c.spans[k].style.opacity=t>=w.s-.02?1:.42})})}
const NAMES=['Brief','Models','Loop','Recipes','Vision','Review','Persist','Switch','Projects','Control'];
function buildNav(){NAMES.forEach((n,i)=>{NAVEL.push(mk('div','nv',`<b>${i+1}</b>${n}`,$('#nav')))})}
function navUpd(t){const nv=$('#nav');const sIn=T.lines[1].s-.6,sOut=T.lines[11].s-.2;nv.style.opacity=P(t,sIn,.6)*(1-P(t,sOut,.5));let cur=-1;for(let k=1;k<=10;k++)if(t>=T.lines[k].s-.2)cur=k-1;NAVEL.forEach((el,i)=>{el.className='nv'+(i===cur?' on':(i<cur?' past':''))})}

/* ======================= seek ======================= */
function seek(t){
  updBg(t);
  SC.forEach((s,k)=>{const [a,b]=WIN[k];const vis=t>=a&&t<=b;s.el.style.visibility=vis?'visible':'hidden';if(!vis)return;
    const fi=P(t,a,.55,E.out),fo=1-P(t,b-.45,.45,E.lin);s.el.style.opacity=(k===0?1:fi)*fo;s.el.style.transform=`translateY(${(1-fi)*(k?18:0)}px) scale(${.985+.015*fi+(1-fo)*.012})`;s.upd(t)});
  capUpd(t);navUpd(t);
}
window.seek=seek;
fetch('timeline.json').then(r=>r.json()).then(j=>{T=j;WIN=T.scenes;SC=[scene0(),scene1(),scene2(),scene3(),scene4(),scene5(),scene6(),scene7(),scene8(),scene9(),scene10(),scene11()];buildCaps();buildNav();seek(0);document.fonts.ready.then(()=>{window.READY=true})});
</script></body></html>
