<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aqua 3D viewer</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0c10;color:#e8eaee;font:13px "Segoe UI",system-ui,sans-serif}
#bg{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 0%,#2a2f3a,#0b0c10 70%)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;z-index:5}
#ui>*{background:rgba(30,33,40,.78);border:1px solid rgba(255,255,255,.16);color:inherit;border-radius:999px;padding:7px 14px;font:inherit;backdrop-filter:blur(10px)}
button{cursor:pointer}button.on{background:#e8eaee;color:#14161a}
#stat{margin-left:auto;color:#9ea3ad}
#msg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#9ea3ad;text-align:center;max-width:420px;line-height:1.5}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/addons/"}}</script>
</head><body>
<div id="bg"></div><div id="msg">Loading...</div>
<div id="ui"><select id="sel" title="Models in the models folder"></select><button id="wire">Wireframe</button><button id="rot" class="on">Auto-rotate</button><button id="grid" class="on">Grid</button><button id="shot">Save picture</button><span id="stat"></span></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
import {STLLoader} from 'three/addons/loaders/STLLoader.js';

const $=s=>document.querySelector(s);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(45,1,.01,5000);camera.position.set(3,2.2,4);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.autoRotate=true;controls.autoRotateSpeed=1.2;
scene.add(new THREE.HemisphereLight(0xdfe8ff,0x20242c,1.1));
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(5,9,6);key.castShadow=true;key.shadow.mapSize.set(2048,2048);scene.add(key);
const fill=new THREE.DirectionalLight(0x9fb4ff,.6);fill.position.set(-6,3,-4);scene.add(fill);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.ShadowMaterial({opacity:.28}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
let grid=new THREE.GridHelper(40,40,0x56606e,0x2c323c);scene.add(grid);
let current=null,mixer=null;const clock=new THREE.Clock();

function fit(obj){
  const box=new THREE.Box3().setFromObject(obj);const size=box.getSize(new THREE.Vector3()),c=box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(c.x,box.min.y,c.z));const r=Math.max(size.x,size.y,size.z)||1;
  ground.position.y=-r*0.004;scene.remove(grid);grid=new THREE.GridHelper(Math.max(10,Math.ceil(r*4)),Math.max(10,Math.ceil(r*4)),0x56606e,0x2c323c);grid.position.y=-r*0.008;grid.visible=$('#grid').classList.contains('on');scene.add(grid);
  key.position.set(r*1.6,r*2.6,r*1.8);key.shadow.camera.left=key.shadow.camera.bottom=-r*2;key.shadow.camera.right=key.shadow.camera.top=r*2;key.shadow.camera.far=r*10;key.shadow.camera.updateProjectionMatrix();
  controls.target.set(0,size.y/2,0);camera.position.set(r*1.5,size.y*.7+r*.5,r*1.9);camera.near=r/100;camera.far=r*100;camera.updateProjectionMatrix();controls.update();
}
function prepare(obj){let tris=0;obj.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;const g=o.geometry;tris+=g.index?g.index.count/3:g.attributes.position.count/3;
  [].concat(o.material).forEach(m=>{m.side=THREE.DoubleSide})}});return tris}
async function load(url){
  $('#msg').textContent='Loading...';$('#msg').style.display='block';
  if(current){scene.remove(current);current=null}mixer=null;
  const ext=url.split('?')[0].split('.').pop().toLowerCase();
  try{
    let obj;
    if(ext==='glb'||ext==='gltf'){const g=await new GLTFLoader().loadAsync(url);obj=g.scene;if(g.animations&&g.animations.length){mixer=new THREE.AnimationMixer(obj);mixer.clipAction(g.animations[0]).play()}}
    else if(ext==='obj'){obj=await new OBJLoader().loadAsync(url);obj.traverse(o=>{if(o.isMesh&&!o.material.map)o.material=new THREE.MeshStandardMaterial({color:0xb8c0cc,roughness:.6})})}
    else if(ext==='stl'){const geo=await new STLLoader().loadAsync(url);geo.computeVertexNormals();obj=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xb8c0cc,roughness:.55,metalness:.1}))}
    else throw new Error('Unsupported file type .'+ext);
    const tris=prepare(obj);scene.add(obj);current=obj;fit(obj);$('#msg').style.display='none';$('#stat').textContent=Math.round(tris).toLocaleString()+' triangles';
    window.__loaded={url,triangles:Math.round(tris)};
    if(typeof afterLoad==='function')afterLoad();
  }catch(e){$('#msg').innerHTML='Could not load <b>'+url+'</b><br>'+e.message;window.__loaded={error:String(e)}}
}
const params=new URLSearchParams(location.search);
const SHEET=params.get('sheet')==='1',REPORT=params.get('report')==='1';
if(SHEET||REPORT){document.getElementById('ui').style.display='none';controls.autoRotate=false;controls.enabled=false;document.getElementById('msg').style.display='none'}
// ---- "look at it" modes used by the AI through the look_3d tool (headless browser): contact sheet picture + text report
function analyse(obj){
  const all=new THREE.Box3().setFromObject(obj),S=all.getSize(new THREE.Vector3());const parts=[];
  obj.traverse(o=>{if(o.isMesh){const b=new THREE.Box3().setFromObject(o);parts.push({name:o.name||(o.parent&&o.parent.name)||'part',b,o})}});
  const foot=S.x*S.z,H=S.y,R=Math.max(S.x,S.y,S.z),eps=Math.max(R*0.012,0.02);
  const isGround=p=>{const s=p.b.getSize(new THREE.Vector3());return s.x*s.z>0.6*foot&&s.y<0.08*H+eps&&parts.length>1};
  const floating=[],sunk=[],tiny=[];
  parts.forEach((p,i)=>{
    const s=p.b.getSize(new THREE.Vector3());
    if(Math.max(s.x,s.y,s.z)<R*0.004)tiny.push(p.name);
    if(isGround(p))return;
    if(p.b.min.y<-0.1*Math.max(s.y,eps*3)-eps)sunk.push(p.name+' (below ground by '+(-p.b.min.y).toFixed(2)+')');
    if(p.b.min.y<=eps)return;
    const e=p.b.clone().expandByScalar(eps);let touch=false;
    for(let j=0;j<parts.length;j++){if(j!==i&&e.intersectsBox(parts[j].b)){touch=true;break}}
    if(!touch)floating.push(p.name+' at y='+p.b.min.y.toFixed(2));
  });
  const f=n=>n.toFixed(2);
  const lines=['Size (x wide, y high, z deep): '+f(S.x)+' x '+f(S.y)+' x '+f(S.z)+' units','Parts (meshes): '+parts.length,'Triangles: '+Math.round(window.__loaded?window.__loaded.triangles:0)];
  lines.push(floating.length?'FLOATING parts that touch nothing ('+floating.length+'): '+floating.slice(0,15).join('; '):'Floating parts: none');
  lines.push(sunk.length?'Parts sunk into the ground: '+sunk.slice(0,10).join('; '):'Sunk parts: none');
  if(tiny.length)lines.push('Almost invisible parts: '+tiny.slice(0,10).join('; '));
  return {lines,size:S,all,ground:parts.filter(isGround).map(p=>p.o)};
}
function asciiViews(obj,info){
  const W=100,H=50,rt=new THREE.WebGLRenderTarget(W,H),buf=new Uint8Array(W*H*4);
  const c=info.all.getCenter(new THREE.Vector3()),S=info.size;const ramp=' .:-=+*#%@';
  const hid=[ground,grid].concat(info.ground);hid.forEach(o=>o.visible=false);const out=[];
  const defs=[['FRONT (looking along -z, x to the right)',new THREE.Vector3(0,0,1),S.x,S.y],['SIDE (looking along -x, z to the left)',new THREE.Vector3(1,0,0),S.z,S.y],['TOP (looking down, x right, z toward you)',new THREE.Vector3(0,1,0),S.x,S.z]];
  const oc=renderer.getClearColor(new THREE.Color()),oa=renderer.getClearAlpha();renderer.setClearColor(0x000000,0);
  for(const [name,dir,a,b] of defs){
    const hw=Math.max(a,2*b)/2*1.08,hh=hw/2,cam=new THREE.OrthographicCamera(-hw,hw,hh,-hh,0.01,1e4);
    cam.position.copy(c).addScaledVector(dir,Math.max(S.x,S.y,S.z)*3+5);cam.up.set(0,dir.y?0:1,dir.y?-1:0);cam.lookAt(c);
    renderer.setRenderTarget(rt);renderer.clear();renderer.render(scene,cam);renderer.readRenderTargetPixels(rt,0,0,W,H,buf);renderer.setRenderTarget(null);
    const rows=[];
    for(let y=0;y<H;y+=2){let s='';for(let x=0;x<W;x++){let v=0,n=0;for(let k=0;k<2;k++){const i=((H-1-(y+k))*W+x)*4;if(buf[i+3]>20){v+=(buf[i]*.3+buf[i+1]*.59+buf[i+2]*.11)/255;n++}}
        s+=n===0?' ':ramp[Math.max(1,Math.min(9,Math.round((v/n)*8)+1))]}rows.push(s.replace(/\s+$/,''))}
    while(rows.length&&!rows[rows.length-1])rows.pop();while(rows.length&&!rows[0])rows.shift();
    out.push(name+':\n'+rows.join('\n'));
  }
  renderer.setClearColor(oc,oa);hid.forEach(o=>o.visible=true);rt.dispose();return out.join('\n\n');
}
function doReport(){
  const info=analyse(current);let txt=info.lines.join('\n')+'\n\n'+asciiViews(current,info);
  const pre=document.createElement('pre');pre.id='rep';pre.textContent=txt;pre.style.cssText='position:fixed;left:0;top:0;opacity:0;font-size:1px';document.body.appendChild(pre);window.__report=txt;
}
function doSheet(){
  const info=analyse(current),S=info.size,c=info.all.getCenter(new THREE.Vector3());
  const w=innerWidth,h=innerHeight,cw=w/2,ch=h/2,R=S.length()/2,d=R/Math.sin(THREE.MathUtils.degToRad(30/2))*0.78;grid.visible=false;
  const defs=[['3/4 view',[1,.75,1.25]],['front',[0,.15,1]],['side (from the right)',[1,.15,0]],['top',[0,1,.001]]];
  renderer.setScissorTest(true);renderer.setClearColor(0x1a1d24,1);
  const cams=[];
  defs.forEach(([name,v],i)=>{
    const x=(i%2)*cw,y=(i<2?ch:0),cam=new THREE.PerspectiveCamera(30,cw/ch,d/100,d*20),dir=new THREE.Vector3(...v).normalize();
    cam.position.copy(c).addScaledVector(dir,d);cam.lookAt(c);cams.push([cam,x,y]);
    const l=document.createElement('div');l.textContent=name;l.style.cssText='position:fixed;left:'+(x+8)+'px;top:'+((i<2?0:ch)+6)+'px;color:#c8ccd4;font:12px sans-serif;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:9px';document.body.appendChild(l);
  });
  let frames=0;renderer.setAnimationLoop(()=>{cams.forEach(([cam,x,y])=>{renderer.setViewport(x,y,cw,ch);renderer.setScissor(x,y,cw,ch);renderer.render(scene,cam)});if(++frames>=3)window.__sheetDone=true});
}
function afterLoad(){if(!current)return;if(REPORT)doReport();else if(SHEET)doSheet()}
(async()=>{
  let list=[];try{list=await (await fetch('../models/models.json',{cache:'no-store'})).json()}catch(e){}
  const sel=$('#sel');list.forEach(m=>{const o=document.createElement('option');o.value='../models/'+m.file;o.textContent=m.file;sel.appendChild(o)});
  let first=params.get('m');
  if(first&&![...sel.options].some(o=>o.value===first)){const o=document.createElement('option');o.value=first;o.textContent=first.split('/').pop();sel.appendChild(o)}
  if(!first&&sel.options.length)first=sel.options[sel.options.length-1].value;
  if(first){sel.value=first;load(first)}else{$('#msg').innerHTML='No model yet.<br>Save one into the <b>models</b> folder, for example with aqua3d.'}
  sel.onchange=()=>load(sel.value);
})();
$('#wire').onclick=e=>{e.target.classList.toggle('on');const w=e.target.classList.contains('on');current&&current.traverse(o=>{if(o.isMesh)[].concat(o.material).forEach(m=>m.wireframe=w)})};
$('#rot').onclick=e=>{e.target.classList.toggle('on');controls.autoRotate=e.target.classList.contains('on')};
$('#grid').onclick=e=>{e.target.classList.toggle('on');grid.visible=e.target.classList.contains('on')};
$('#shot').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.download='model.png';a.href=renderer.domElement.toDataURL('image/png');a.click()};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',resize);resize();
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();if(mixer)mixer.update(dt);controls.update();renderer.render(scene,camera)});
</script></body></html>
