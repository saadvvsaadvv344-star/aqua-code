<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Space Dodge</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05070f;color:#e6ecff;font-family:system-ui,sans-serif}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
#hud{position:fixed;left:14px;top:10px;font-size:18px;pointer-events:none}
#over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,7,15,.7);gap:10px;text-align:center}
button{background:#3a5bd9;color:#fff;border:0;border-radius:12px;padding:10px 22px;font:inherit;font-size:18px;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">Score <b id="sc">0</b> &nbsp; Best <b id="best">0</b></div>
<div id="over"><h1 id="msg">Game over</h1><div>Move: arrows / WASD / drag or touch. Auto-fire is on.</div><button id="again">Play again</button></div>
<script>
// TESTED STARTER: 2D canvas action game (player, auto-fire, enemies, score, game over, restart, keyboard + mouse + touch). Change sprites, enemy types and rules below.
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
addEventListener('resize', resize); resize();

const keys = {}; addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); }); addEventListener('keyup', e => keys[e.code] = false);
let pointer = null;
cv.addEventListener('pointerdown', e => { pointer = {x: e.clientX, y: e.clientY}; });
cv.addEventListener('pointermove', e => { if (pointer) pointer = {x: e.clientX, y: e.clientY}; });
addEventListener('pointerup', () => pointer = null);

let player, bullets, enemies, stars, score, best = +localStorage.getItem('best') || 0, alive, spawnT, fireT, t0;
document.getElementById('best').textContent = best;
function reset() {
  player = {x: W / 2, y: H * 0.8, r: 16, speed: 360};
  bullets = []; enemies = []; score = 0; alive = true; spawnT = 0; fireT = 0; t0 = performance.now();
  stars = Array.from({length: 90}, () => ({x: Math.random() * W, y: Math.random() * H, s: 20 + Math.random() * 80, r: Math.random() * 1.6 + .3}));
  document.getElementById('over').style.display = 'none';
}
document.getElementById('again').onclick = reset;
addEventListener('keydown', e => { if (!alive && (e.code === 'Enter' || e.code === 'Space')) reset(); });

function endGame() {
  alive = false; best = Math.max(best, score); localStorage.setItem('best', best);
  document.getElementById('best').textContent = best;
  document.getElementById('msg').textContent = 'Game over: ' + score;
  document.getElementById('over').style.display = 'flex';
}

function update(dt) {
  for (const s of stars) { s.y += s.s * dt; if (s.y > H) { s.y = 0; s.x = Math.random() * W; } }
  if (!alive) return;
  let dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  let dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
  if (pointer) { const vx = pointer.x - player.x, vy = pointer.y - player.y, d = Math.hypot(vx, vy); if (d > 6) { dx = vx / d; dy = vy / d; } }
  player.x = Math.max(player.r, Math.min(W - player.r, player.x + dx * player.speed * dt));
  player.y = Math.max(player.r, Math.min(H - player.r, player.y + dy * player.speed * dt));
  fireT -= dt; if (fireT <= 0) { bullets.push({x: player.x, y: player.y - 18, vy: -620}); fireT = 0.18; }
  const level = 1 + (performance.now() - t0) / 20000;                       // difficulty grows over time
  spawnT -= dt; if (spawnT <= 0) { enemies.push({x: Math.random() * W, y: -30, r: 14 + Math.random() * 14, vy: (90 + Math.random() * 90) * level, hp: 1}); spawnT = Math.max(0.25, 0.9 / level); }
  for (const b of bullets) b.y += b.vy * dt;
  bullets = bullets.filter(b => b.y > -20);
  for (const e of enemies) {
    e.y += e.vy * dt;
    if (Math.hypot(e.x - player.x, e.y - player.y) < e.r + player.r - 4) endGame();
    for (const b of bullets) if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + 4) { e.hp--; b.y = -99; if (e.hp <= 0) { score += 10; document.getElementById('sc').textContent = score; } }
  }
  enemies = enemies.filter(e => e.hp > 0 && e.y < H + 40);
}

function draw() {
  ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#9fb4ff'; for (const s of stars) { ctx.globalAlpha = .4 + s.r / 3; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill(); } ctx.globalAlpha = 1;
  ctx.fillStyle = '#ffe27a'; for (const b of bullets) ctx.fillRect(b.x - 2, b.y - 8, 4, 14);
  for (const e of enemies) { ctx.fillStyle = '#ff5a7a'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, 7); ctx.fill(); ctx.fillStyle = '#2a0d18'; ctx.beginPath(); ctx.arc(e.x - e.r * .3, e.y - 2, e.r * .18, 0, 7); ctx.arc(e.x + e.r * .3, e.y - 2, e.r * .18, 0, 7); ctx.fill(); }
  if (alive) { ctx.save(); ctx.translate(player.x, player.y); ctx.fillStyle = '#5ad1ff'; ctx.beginPath(); ctx.moveTo(0, -player.r); ctx.lineTo(player.r, player.r); ctx.lineTo(0, player.r * .5); ctx.lineTo(-player.r, player.r); ctx.closePath(); ctx.fill(); ctx.restore(); }
}

let last = performance.now();
function loop(now) { const dt = Math.min((now - last) / 1000, 0.05); last = now; update(dt); draw(); requestAnimationFrame(loop); }
reset(); requestAnimationFrame(loop);
</script></body></html>
