<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Scene</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0e18;color:#e6ecff;font-family:system-ui,sans-serif}
canvas{display:block}
#ui{position:fixed;left:14px;top:12px;background:rgba(20,26,46,.6);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);font-size:13px}
button{background:#3a5bd9;color:#fff;border:0;border-radius:10px;padding:6px 12px;margin-top:6px;cursor:pointer;font:inherit}
</style>
<!-- needs the 3d/ folder (the recipes tool copies it): three.js r160, works offline -->
<script type="importmap">{"imports":{"three":"./3d/vendor/three.module.min.js","three/addons/":"./3d/vendor/addons/"}}</script>
</head><body>
<div id="ui"><b>3D scene</b><br>drag = orbit, wheel = zoom<br><button id="spin">Toggle spin</button></div>
<script type="module">
// TESTED STARTER: Three.js scene with lights, shadows, orbit controls and animation. Replace the objects, or load a model:
//   import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'; new GLTFLoader().load('models/thing.glb', g => scene.add(g.scene));
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({antialias: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e18);
scene.fog = new THREE.Fog(0x0b0e18, 12, 40);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(4.5, 3.2, 6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 1, 0);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x20243a, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(5, 8, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -8, right: 8, top: 8, bottom: -8});
scene.add(sun);

const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64), new THREE.MeshStandardMaterial({color: 0x1b2238, roughness: 0.9}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.9, 0.3, 200, 32), new THREE.MeshStandardMaterial({color: 0x5ad1ff, metalness: 0.6, roughness: 0.25}));
knot.position.y = 1.6; knot.castShadow = true; scene.add(knot);
for (let i = 0; i < 6; i++) {
  const a = i / 6 * Math.PI * 2;
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.28, 32, 24), new THREE.MeshStandardMaterial({color: new THREE.Color().setHSL(i / 6, 0.7, 0.6), roughness: 0.3}));
  m.position.set(Math.cos(a) * 3.2, 0.28, Math.sin(a) * 3.2); m.castShadow = true; scene.add(m);
}

let spin = true;
document.getElementById('spin').onclick = () => spin = !spin;
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (spin) { knot.rotation.x = t * 0.5; knot.rotation.y = t * 0.8; }
  controls.update();
  renderer.render(scene, camera);
});
</script></body></html>
